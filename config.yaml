clean:
  min_title_len: 6          # 标题过短视为噪声
  min_content_len: 10       # 正文过短视为噪声
  max_content_len: 5000     # 超长截断
  align_rule: "drop"        # 非交易日新闻对齐规则: drop=剔除 / ffill=前向填充到下一交易日

label:
  pos_threshold: 0.15       # 情感分 > 该值 -> trend_signal = 1
  neg_threshold: -0.15      # 情感分 < 该值 -> trend_signal = -1

ml:
  test_ratio: 0.2           # 按时间 8:2 切分
  tfidf_word_max_features: 60000
  tfidf_char_max_features: 40000
  min_df: 2
  random_state: 42

llm:
  provider: "mock"          # mock | openai  (openai 兼容接口, 需在 .env 配置)
  model: "mock-lexicon-1.0"
  temperature_default: 0.7
  stability_sample_size: 50

signal:
  theta: 0.10               # 开仓阈值
  smoothing: 3              # 信号指数平滑 span(1=不平滑); 日频新闻噪声大, 取 3 日 EMA
  position_mode: "long_flat"  # long_flat | long_short
  cost_bps: 5               # 单边交易成本(bp)

backtest:
  rf_annual: 0.0
  trading_days: 252
